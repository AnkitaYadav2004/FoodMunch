<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            /* transform: scale(5); */
            height: 400px;
            width: 300px;
            border-radius: 50%;
            background-color: blue;
            transition: all 5s cubic-bezier(0.075, 0.82, 0.165, 1) 1s;
            margin: auto;
        }
      /* p{
        transition: all 5s cubic-bezier(0.075, 0.82, 0.165, 1) 1s;
        margin: auto;
        background: transparent;
        transform: scale(5);
       } */
        .box:hover{
            transform: skew(45deg) scale(-45deg);
            width: 100%;
            height: 100vh;
            transform: rotate(45deg);
            
        }
        /* p:hover{
            color: white;
            /* height: 20px;
            width: 20px; */
            /* transform: scale(5); */

        /* } */ 
        /* div:hover{
            transition: all 5s cubic-bezier(0.075, 0.82, 0.165, 1) 1s;
            width: 100%;
            height: 100vh;
            align-content: center;
            text-align: center;

        }
      */
    .spin{
        height: 200px;
        width: 200px;
        /* border-radius:50% ; */
        border: 2px solid black;
        animation: spin 2s linear infinite;
        margin: auto;
        margin-top: 20px;

    }
    @keyframes spin {
        0%{
            transform: rotate(0deg);
        }
        100%{
            transform: rotate(360deg);

        }
        
    }
       

    </style>
</head>
<body>
    <!-- transition-- to apply smoth animation  -->
    <div class="box">
      

    </div>

    <div class="spin">
        
    </div>
    
</body>
</html>
