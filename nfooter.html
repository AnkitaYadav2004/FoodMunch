<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix India</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        input[type="email"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 300px;
            margin-bottom: 10px;
        }

        button {
            background-color: red;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #cc0000;
        }

        footer {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            font-size: 14px;
        }

        .links {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 20px;
        }

        .links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ready to watch? Enter your email to create or restart your membership.</h1>
        <input type="email" placeholder="Email address">
        <button>Get Started > </button>
        <p>Questions? Call 000-800-919-
