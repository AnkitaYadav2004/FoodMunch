<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Netflix Clone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background-color: #000;
    background-image: url("https://miro.medium.com/v2/resize:fit:1200/1*5lyavS59mazOFnb55Z6znQ.png"
    );
}

.navbar-brand {
    font-size: 1.5rem;
  }
  .navbar{
    
    background: linear-gradient(
        rgba(0, 0, 0, 0.689),
        rgba(0, 0, 0, 0.705)
      )
      
  }
  .navbar .logo {
    font-weight: 900;
   font-size: 50px;
   font-family: Arial, Helvetica, sans-serif sans-serif;
  }

  #navbarNav{
    width: 500px;
    display: flex;
    
    gap: 20px;
    /* border: 1px solid white; */

 
  }
    
.NLogin{
  margin-right: 50%;
  border: 1px solid red;
  height: 800px;
  width: 500px;
  display: flex;
  justify-content: center;
  margin: 0 auto;
}

  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark  navbar">
    <div class="container">
      <a class="navbar-brand text-danger logo" href="Netflex.html">NETFLIX</a>
      <!-- <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span> -->
      </button>

      </div>
  <div class="container mt-5 NLogin">
    <h2 class="text-center">Login</h2>
    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <a href="Netflex.html"> <button type="submit" class="btn btn-danger w-100">Login</button></a>

      <a href="nsignup.html"> <button type="submit" class="btn btn-primary w-100">Sign Up</button></a>

      
    </form>
  </div>
</body>
</html>
